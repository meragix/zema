name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  zema:
    uses: ./.github/workflows/_dart_package.yml
    with:
      package: packages/zema
    secrets: inherit

  zema_forms:
    uses: ./.github/workflows/_flutter_package.yml
    with:
      package: packages/zema_forms
    secrets: inherit

  zema_firestore:
    uses: ./.github/workflows/_flutter_package.yml
    with:
      package: packages/zema_firestore
    secrets: inherit

  zema_hive:
    uses: ./.github/workflows/_dart_package.yml
    with:
      package: packages/zema_hive
    secrets: inherit

  zema_standard_schema:
    uses: ./.github/workflows/_dart_package.yml
    with:
      package: packages/zema_standard_schema
    secrets: inherit

  # Every ```dart block of the READMEs and pub.dev examples must compile
  # against the current packages. Docs pages are reported but not gated yet.
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap
        run: |
          dart pub global activate melos 7.4.0
          melos bootstrap
      - name: README and example snippets (gate)
        run: dart run scripts/check_snippets.dart --readmes
      - name: Docs snippets (report only)
        continue-on-error: true
        run: dart run scripts/check_snippets.dart docs/

  # packages/zema must keep compiling and passing on the web (dart2js).
  zema_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Bootstrap
        run: |
          dart pub global activate melos 7.4.0
          melos bootstrap
      - name: Test on Chrome
        working-directory: packages/zema
        run: dart test -p chrome
