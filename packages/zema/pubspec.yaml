name: zema
description: "Zod-style schema validation for Dart and Flutter. Every error in one pass, translated messages, typed results, no code generation. Works on the web."
version: 0.7.0
homepage: https://github.com/meragix/zema
repository: https://github.com/meragix/zema/tree/main/packages/zema
issue_tracker: https://github.com/meragix/zema/issues
documentation: https://zema.meragix.dev

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  meta: ^1.17.0

dev_dependencies:
  test: ^1.24.0
  coverage: ^1.7.0
  benchmark_harness: ^2.2.0
  lints: ^6.1.0

topics:
  - validation
  - schema
  - json
  - zod
  - parsing
